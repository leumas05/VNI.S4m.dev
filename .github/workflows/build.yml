name: Build VNI Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Install Root Dependencies
        run: npm install

      - name: Build App (No Publish)
        run: npm run build:app -- -wml --publish never
        if: false # Wait, I don't need this, I'll just run it normally

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          npm run build:app -- -w --publish never
          npx pkg backend/server.js -t node18-win-x64 -o release/S4m.s-VNI-Background-Engine.win.exe

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: |
          npm run build:app -- -m --publish never
          npx pkg backend/server.js -t node18-macos-x64 -o release/S4m.s-VNI-Background-Engine.mac

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build:app -- -l --publish never
          npx pkg backend/server.js -t node18-linux-x64 -o release/S4m.s-VNI-Background-Engine.linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
